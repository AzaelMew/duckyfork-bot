version: 2
# Weekly, grouped dependency updates.
# Majors for the five packages that decide how the bots talk to Discord,
# Minecraft and Hypixel are ignored: those need a manual migration, a canary
# deploy and a look at every caller (see CONTRIBUTING.md).
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "discord.js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@discordjs/rest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "skyhelper-networth"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mineflayer"
        update-types: ["version-update:semver-major"]
