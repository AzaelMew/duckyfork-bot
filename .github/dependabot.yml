# Weekly, grouped patch/minor updates. Majors of the packages that can break a
# live bot (or need a newer Node than the hosts run) are ignored on purpose;
# they are upgraded by hand through a PR that goes past the gate.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "discord.js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@discordjs/rest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "skyhelper-networth"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mineflayer"
        update-types: ["version-update:semver-major"]
